name: iOS Build

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Verify Flutter installation
      run: flutter doctor -v

    - name: Build iOS (release, no codesign)
      run: flutter build ipa --release --no-codesign --export-method development

    - name: Build for iOS Simulator
      run: flutter build ios --simulator --debug

    - name: Launch iOS Simulator
      run: |
        xcrun simctl boot "iPhone 15 Pro" || true
        sleep 5

    - name: Install and run app on simulator
      run: |
        xcrun simctl install booted build/ios/iphonesimulator/Runner.app
        xcrun simctl launch booted com.example.pknetflix
        sleep 10

    - name: Take screenshot
      run: |
        xcrun simctl io booted screenshot screenshot.png
        ls -la screenshot.png

    - name: Upload screenshot
      uses: actions/upload-artifact@v4
      with:
        name: ios-screenshot
        path: screenshot.png
        retention-days: 7

    - name: Upload iOS build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa-build
        path: build/ios/ipa/*.ipa
        retention-days: 7

    - name: Build summary
      run: |
        echo "### iOS Build Complete ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: Success" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter Version**: $(flutter --version | head -n 1)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Artifacts**: Available for download" >> $GITHUB_STEP_SUMMARY
